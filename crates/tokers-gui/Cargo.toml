[package]
name = "tokers-gui"
description = "Native TikTok client UI (gpui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tokers"
path = "src/main.rs"

[dependencies]
tokers.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
tokio.workspace = true
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
futures = "0.3.34"
image = "0.25"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smallvec = "1.16.2"
anyhow = "1.0.104"
libheif-rs = "3.0.0"
