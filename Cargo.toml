[workspace]
resolver = "3"
members = ["crates/tokers", "crates/tokers-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokers = { path = "crates/tokers" }

gpui = { git = "https://github.com/zxsleebu/gpui", rev = "ea10c4aeb4fa1a5d621bde2c459f5c2df7d68de5" }
gpui_platform = { git = "https://github.com/zxsleebu/gpui", rev = "ea10c4aeb4fa1a5d621bde2c459f5c2df7d68de5", features = ["font-kit", "wayland", "x11"] }
flate2 = "1"
form_urlencoded = "1"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
wreq = { version = "6.0.0-rc.31", features = ["gzip", "brotli", "deflate", "zstd", "socks"] }
wreq-util = "3.0.0-rc.14"

# Mirrors the [patch] section of the gpui workspace; git dependencies do not
# inherit it, and gpui does not build against the crates.io versions.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

# gpui, the decoders and the image crate are unusably slow unoptimised; our own
# crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
